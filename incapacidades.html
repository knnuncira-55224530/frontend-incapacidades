<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incapacidades</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container">
    <h1>Gestión de Incapacidades</h1>

    <button onclick="window.location.href='dashboard.html'">Volver</button>

    <section>
      <h2>Nueva incapacidad</h2>
      <form id="incapacidadForm">
        <input type="hidden" id="incapacidadId">

        <label>ID empleado</label>
        <input type="number" id="empleado_id" required>

        <label>Fecha inicio</label>
        <input type="date" id="fecha_inicio" required>

        <label>Fecha fin</label>
        <input type="date" id="fecha_fin" required>

        <label>Tipo</label>
        <select id="tipo" required>
          <option value="enfermedad_general">Enfermedad general</option>
          <option value="accidente_laboral">Accidente laboral</option>
          <option value="licencia_medica">Licencia médica</option>
          <option value="incapacidad_temporal">Incapacidad temporal</option>
        </select>

        <label>Diagnóstico general</label>
        <textarea id="diagnostico_general" required></textarea>

        <label>Entidad médica</label>
        <input type="text" id="entidad_medica" required>

        <label>Observaciones</label>
        <textarea id="observaciones"></textarea>

        <label>Estado</label>
        <select id="estado" required>
          <option value="registrada">Registrada</option>
          <option value="en_revision">En revisión</option>
          <option value="aprobada">Aprobada</option>
          <option value="rechazada">Rechazada</option>
          <option value="finalizada">Finalizada</option>
        </select>

        <button type="submit">Guardar</button>
      </form>

      <p id="incapacidadMessage"></p>
    </section>

    <section>
      <h2>Listado</h2>
      <table border="1" width="100%">
        <thead>
          <tr>
            <th>ID</th>
            <th>Empleado</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Tipo</th>
            <th>Diagnóstico</th>
            <th>Entidad</th>
            <th>Días</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="incapacidadTable"></tbody>
      </table>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/incapacidades.js"></script>
</body>
</html>
